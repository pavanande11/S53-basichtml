<html>
    <head>
        <title>Tables Design</title>
    </head>
    <body>
        <table border="1" cellspacing="5" cellpadding="10" align="center">
            <caption>Student List</caption>
            <thead>
            <tr>
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Course Name</th>
                <th>Grade</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>2500030158</td>
                <td>Rama Krishna</td>
                <td>Front End Web Development</td>
                <td>A</td>
            </tr>
            <tr>
                <td>2500031485</td>
                <td>Swapna</td>
                <td>Maths</td>
                <td>B<sup>+</sup></td>
            </tr>
            <tr>
                <td>2500032897</td>
                <td>Praveen Prakash</td>
                <td>Chemistry</td>
                <td>B</td>
                
            </tr>
            <tr>
                <td>2500030763</td>
                <td>Rohit</td>
                <td>Physics</td>
                <td>A<sup>+</sup></td>
            </tr>
            </tbody>
            <tfoot>
                <td colspan="4" align="center">End of the Student List</td>
            </tfoot>
        </table>
        <h2>Rowspan and Colspan</h2>
        <table border="1">
            <tr>
                <td>Cell 1</td>
                <td>Cell 2</td>
                <td> Cell 3</td>
            </tr>
            <tr>
                <td rowspan="2">Cell 4</td>
                <td>Cell 5</td>
                <td>Cell 6</td>
            </tr>
            <tr>
                <td colspan="2">Cell 7</td>
            </tr>
        </table>
    </body>
</html>
